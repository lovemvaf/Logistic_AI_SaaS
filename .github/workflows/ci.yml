name: SmartLogi CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-verify:
    name: Static Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run static invariant verifier
        run: python3 -X utf8 scripts/static-verify.py

  node-workspace:
    name: Node Workspace Build, Typecheck & Jest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal workspace packages & generate Prisma Client
        run: |
          pnpm --filter shared-types build
          pnpm --filter wms-engine build
          pnpm --filter ui-components build
          pnpm --filter ui-kit build
          pnpm --filter hardware-bridge build
          pnpm --filter offline-sync-engine build
          pnpm --filter prisma-schemas exec prisma generate

      - name: Run Jest unit test suites
        run: |
          pnpm exec jest --config packages/wms-engine/jest.config.js
          pnpm exec jest --config api/api-gateway/jest.config.js
          pnpm exec jest --config backend/core-api/jest.config.js --runInBand

      - name: Typecheck backends & gateway
        run: |
          pnpm --filter shared-types exec tsc --noEmit
          pnpm --filter wms-engine exec tsc --noEmit
          pnpm --filter core-api exec tsc --noEmit
          pnpm --filter api-gateway exec tsc --noEmit

      - name: Generate Next.js route types & typecheck portals + mobile
        run: |
          pnpm --filter admin-portal exec next typegen
          pnpm --filter admin-portal exec tsc --noEmit
          pnpm --filter tenant-portal exec next typegen
          pnpm --filter tenant-portal exec tsc --noEmit
          pnpm --filter customer-portal exec next typegen
          pnpm --filter customer-portal exec tsc --noEmit
          pnpm --filter pack-station-web exec next typegen
          pnpm --filter pack-station-web exec tsc --noEmit
          pnpm --filter driver-app exec tsc --noEmit

  ai-worker:
    name: Cloudflare AI Worker Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ai-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/ai-worker/package-lock.json

      - name: Install AI Worker dependencies
        run: npm ci

      - name: Typecheck AI Worker
        run: npx tsc --noEmit

      - name: Run AI Worker test suites
        run: |
          npx tsx tests/llm.test.ts
          npx tsx tests/journey.test.ts
          npx tsx tests/vrp.test.ts
          npx tsx tests/compute.test.ts

  go-services:
    name: Go Services Vet & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet and test gps-ingestion-service
        working-directory: backend/gps-ingestion-service
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Vet and test webhook-service
        working-directory: backend/webhook-service
        run: |
          go vet ./...
          go test -v -race ./...

  rust-api:
    name: Rust API Parity Workspace Check & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rust-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust-api

      - name: Run cargo check and cargo test
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          def emit_lines(text):
              lines = [l.strip() for l in text.splitlines() if l.strip()]
              for l in lines[-8:]:
                  safe = l.replace("%", "%25").replace("\r", "").replace("\n", " ")
                  print(f"::error::{safe}")
          p = subprocess.run(
              ["cargo", "check", "--workspace", "--all-targets", "--message-format=json"],
              capture_output=True,
              text=True,
          )
          emitted = 0
          for line in p.stdout.splitlines():
              try:
                  msg = json.loads(line)
              except Exception:
                  continue
              if msg.get("reason") == "compiler-message":
                  m = msg.get("message", {})
                  level = m.get("level")
                  rendered = m.get("rendered", "").strip()
                  if level in ("error", "failure-note") and rendered:
                      print(rendered, file=sys.stderr)
                  if level == "error":
                      spans = [s for s in m.get("spans", []) if s.get("is_primary")]
                      text = (m.get("message") or "rust error").replace("%", "%25").replace("\r", "").replace("\n", " ")
                      if spans:
                          s = spans[0]
                          print(f"::error file=backend/rust-api/{s['file_name']},line={s['line_start']},col={s['column_start']}::{text}")
                      else:
                          print(f"::error::{text}")
                      emitted += 1
          if p.returncode != 0:
              sys.stderr.write(p.stderr)
              if emitted == 0:
                  emit_lines(p.stderr)
              sys.exit(p.returncode)
          t = subprocess.run(["cargo", "test", "--workspace"], capture_output=True, text=True)
          sys.stdout.write(t.stdout)
          sys.stderr.write(t.stderr)
          if t.returncode != 0:
              emit_lines(t.stdout + "\n" + t.stderr)
              sys.exit(t.returncode)
          PY

  postgres-rls:
    name: PostgreSQL Migrations & RLS Isolation Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: smartlogi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d smartlogi_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Deploy Prisma migrations & run fail-closed RLS SQL regression
        env:
          DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/smartlogi_test
        run: |
          pnpm --filter prisma-schemas exec prisma migrate deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/prisma-schemas/prisma/tests/tenant-isolation.sql
