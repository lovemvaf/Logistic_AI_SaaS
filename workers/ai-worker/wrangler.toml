name = "smartlogi-ai-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# Set via CLOUDFLARE_ACCOUNT_ID env var or run `npx wrangler login` before live deploy
minify = true

# Plain variables (non-secret). Exposed to the Worker as env.VAR_NAME.
# CLOUDFLARE_MODEL (optional) overrides DEFAULT_MODEL for Workers AI — set it
# in `.dev.vars` for local dev or as a Worker var/secret for prod (mirrors the
# `CLOUDFLARE_MODEL` entry in the repo .env). Example:
#   CLOUDFLARE_MODEL=@cf/meta/llama-3.1-8b-instruct-fast
[vars]
JWT_ALGORITHM = "HS256"
DEFAULT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# --- Secrets (fill via: npx wrangler secret put <NAME> OR .dev.vars) ---
# JWT_SECRET          - HS256 secret used to verify caller JWTs (share with api-gateway/core-api).
# AI_API_KEY          - shared key accepted for internal service-to-service calls (core-api -> Worker).

# Zero-UUID placeholders allow `wrangler dev --local` and `wrangler deploy --dry-run` out of the box;
# replace with real IDs from `wrangler d1 create` and `wrangler kv namespace create` for live deploy.
[[d1_databases]]
binding = "DB"
database_name = "smartlogi-ai-meta"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

[ai]
binding = "AI"

[env.production.vars]
DEFAULT_MODEL = "@cf/meta/llama-3.1-70b-instruct"

[observability]
enabled = true
head_sampling_rate = 1
